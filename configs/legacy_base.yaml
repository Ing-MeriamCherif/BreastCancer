# Reproduces the original notebooks (paper v3, configs A/B/C) with the new code.
# Only intentional differences: per-step cosine LR (legacy: per-epoch), and offline
# evaluation (OOF-fitted temperature + threshold) in addition to the legacy tau=0.45.
seed: 42
data:
  records: data/records_legacy.csv     # scripts/audit_data.py --resolver legacy
  input: legacy                        # raw JPEG -> MammographyAugment -> resize/center-crop 224
  legacy_split: true                   # drop patient+laterality pathology conflicts (train AND test)
cv: {n_folds: 3, method: group}
model:
  backbone: hf_clip:openai/clip-vit-base-patch32
  image_size: 224
  finetune: last_k
  last_k: 4
  dropout: 0.3
optim: {lr: 1.0e-5, backbone_lr_mult: 0.1, neck_lr_mult: 5.0, head_lr_mult: 10.0, llrd: 1.0, weight_decay: 0.01}
train:
  epochs: 20
  patience: 5
  batch_size: 8
  grad_accum: 1
  warmup_epochs: 0
  min_lr_ratio: 0.01
  sampler: pathology
  num_workers: 4
  amp: false
  mtl_weighting: fixed
heads:
  pathology:  {type: binary,  weight: 2.0, loss: {name: ce, class_weight: [1.0, 3.0]}}
  assessment: {type: ordinal, weight: 1.5, classes: [0, 1, 2, 3, 4, 5, 6], loss: {name: gaussian, sigma: 0.9}}
  subtlety:   {type: ordinal, weight: 0.5, classes: [1, 2, 3, 4, 5], loss: {name: gaussian, sigma: 0.9}}
  density:    {type: ordinal, weight: 1.0, classes: [1, 2, 3, 4], loss: {name: gaussian, sigma: 0.9}}
  shape:      {type: categorical, weight: 1.0, loss: {name: ce, label_smoothing: 0.1}}
  margins:    {type: categorical, weight: 1.0, loss: {name: ce, label_smoothing: 0.1}}
